<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<style>
    div {
        width: 200px;
        height: 200px;
        background-color: pink;
    }
</style>
<body>
<div></div>
<script>
  const div = document.querySelector('div')
  //鼠标经过
  div.addEventListener('mouseenter', function() {
    console.log('鼠标经过')
  })
  //鼠标离开
  div.addEventListener('mouseleave', function() {
    console.log('鼠标离开')
  })
</script>
</body>
</html>
