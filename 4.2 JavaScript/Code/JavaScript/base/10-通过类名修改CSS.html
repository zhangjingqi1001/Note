<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
      div {
          width: 200px;
          height: 200px;
          background-color: pink;
      }

      .box {
          width: 300px;
          height: 300px;
          background-color: rosybrown;
      }
  </style>
</head>

<body>
<div class="nav"></div>

<script>
  //1.获取元素
   const div = document.querySelector('div')
  //2.添加类名
  div.className='box' //box的样式替代了dev的样式
  //div.className='nav box' 既保留了nav的样式，又增加了box样式
</script>
</body>
</html>
