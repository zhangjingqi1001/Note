<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>轮播图点击切换</title>
  <style>
      * {
          box-sizing: border-box;
      }

      .slider {
          width: 560px;
          height: 400px;
          overflow: hidden;
      }

      .slider-wrapper {
          width: 100%;
          height: 320px;
      }

      .slider-wrapper img {
          width: 100%;
          height: 100%;
          display: block;
      }

      .slider-footer {
          height: 80px;
          background-color: rgb(100, 67, 68);
          padding: 12px 12px 0 12px;
          position: relative;
      }

      .slider-footer .toggle {
          position: absolute;
          right: 0;
          top: 12px;
          display: flex;
      }

      .slider-footer .toggle button {
          margin-right: 12px;
          width: 28px;
          height: 28px;
          appearance: none;
          border: none;
          background: rgba(255, 255, 255, 0.1);
          color: #fff;
          border-radius: 4px;
          cursor: pointer;
      }

      .slider-footer .toggle button:hover {
          background: rgba(255, 255, 255, 0.2);
      }

      .slider-footer p {
          margin: 0;
          color: #fff;
          font-size: 18px;
          margin-bottom: 10px;
      }

      .slider-indicator {
          margin: 0;
          padding: 0;
          list-style: none;
          display: flex;
          align-items: center;
      }

      .slider-indicator li {
          width: 8px;
          height: 8px;
          margin: 4px;
          border-radius: 50%;
          background: #fff;
          opacity: 0.4;
          cursor: pointer;
      }

      .slider-indicator li.active {
          width: 12px;
          height: 12px;
          opacity: 1;
      }
  </style>
</head>

<body>
<div class="slider">
  <div class="slider-wrapper">
    <img src="./images/slider01.jpg" alt=""/>
  </div>
  <div class="slider-footer">
    <p>对人类来说会不会太超前了？</p>
    <ul class="slider-indicator">
      <!--active是高亮的样式-->
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>
    <div class="toggle">
      <button class="prev">&lt;</button>
      <button class="next">&gt;</button>
    </div>
  </div>
</div>
<script>
  //1.初始数据
  const sliderData = [
    { url: './images/slider01.jpg', title: '对人类来说会不会太超前了？', color: 'rgb(100, 67, 68)' },
    { url: './images/slider02.jpg', title: '开启剑与雪的黑暗传说！', color: 'rgb(43, 35, 26)' },
    { url: './images/slider03.jpg', title: '真正的jo厨出现了！', color: 'rgb(36, 31, 33)' },
    { url: './images/slider04.jpg', title: '李玉刚：让世界通过B站看到东方大国文化', color: 'rgb(139, 98, 66)' },
    { url: './images/slider05.jpg', title: '快来分享你的寒假日常吧~', color: 'rgb(67, 90, 92)' },
    { url: './images/slider06.jpg', title: '哔哩哔哩小年YEAH', color: 'rgb(166, 131, 143)' },
    { url: './images/slider07.jpg', title: '一站式解决你的电脑配置问题！！！', color: 'rgb(53, 29, 25)' },
    { url: './images/slider08.jpg', title: '谁不想和小猫咪贴贴呢！', color: 'rgb(99, 72, 114)' }
  ]

  //2.创建随机数
  // function getRandom(N, M) {
  //   return Math.floor(Math.random() * (M - N + 1)) + N
  // }
  //const random = getRandom(1,8)
  const random = parseInt(Math.random() * sliderData.length) //或者是这么生成随机数也行

  //3.把对应的数据渲染到标签里面
  // 3.1获取图片
  const img = document.querySelector('.slider-wrapper img')//表示slider-wrapper类中的第一个img标签
  // 3.2修改图片的路径
  img.src = sliderData[random].url
  // 3.3获取标签p
  const p = document.querySelector('.slider-footer p')//表示slider-footer类中的第一个p标签
  p.innerHTML = sliderData[random].title
  // 3.4修改slider-footer中背景板的颜色
  const sliderFooterDocument = document.querySelector('.slider-footer')
  sliderFooterDocument.style.backgroundColor = sliderData[random].color

  //4.底部ul-li进行切换，对应的li进行高亮
  //这个地方没有用all，因为用all筛选的是一个伪数组
  const li = document.querySelector(`.slider-indicator li:nth-child(${random + 1})`)//选中第random+1个li（因为random是0-7 而li是1-8）
  //当前选中的li添加active这个类
  li.classList.add('active')
</script>
</body>

</html>
